<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TAR Trading System — Research UI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* TAR Trading System — engineering-tool spartan */

:root {
  --bg: #0a0c10;
  --panel: #11141a;
  --panel-2: #161a22;
  --panel-3: #1c2028;
  --border: #1f242d;
  --border-strong: #2a3140;
  --text: #e6e8eb;
  --text-2: #8b929e;
  --text-3: #5a6170;
  --text-4: #3d434e;

  /* status colors - share chroma */
  --green: oklch(70% 0.15 150);
  --green-bg: oklch(70% 0.15 150 / 0.12);
  --green-border: oklch(70% 0.15 150 / 0.3);
  --amber: oklch(78% 0.15 75);
  --amber-bg: oklch(78% 0.15 75 / 0.12);
  --amber-border: oklch(78% 0.15 75 / 0.3);
  --red: oklch(68% 0.20 25);
  --red-bg: oklch(68% 0.20 25 / 0.14);
  --red-border: oklch(68% 0.20 25 / 0.35);
  --blue: oklch(70% 0.14 235);
  --blue-bg: oklch(70% 0.14 235 / 0.12);
  --blue-border: oklch(70% 0.14 235 / 0.3);
  --violet: oklch(70% 0.15 295);

  --accent: var(--blue);
  --accent-bg: var(--blue-bg);

  --mono: "JetBrains Mono", "IBM Plex Mono", "SF Mono", Menlo, monospace;
  --sans: "IBM Plex Sans", -apple-system, system-ui, sans-serif;

  --row: 28px;
  --gap: 12px;
  --pad: 14px;
  --radius: 4px;
}

[data-theme="light"] {
  --bg: #f6f6f4;
  --panel: #ffffff;
  --panel-2: #fafaf8;
  --panel-3: #f0f0ec;
  --border: #e2e2dc;
  --border-strong: #c8c8c0;
  --text: #16181c;
  --text-2: #5a6170;
  --text-3: #8b929e;
  --text-4: #b8bdc5;
  --green-bg: oklch(70% 0.15 150 / 0.14);
  --amber-bg: oklch(78% 0.15 75 / 0.16);
  --red-bg: oklch(68% 0.20 25 / 0.12);
  --blue-bg: oklch(70% 0.14 235 / 0.12);
}

[data-density="compact"] {
  --row: 24px;
  --gap: 8px;
  --pad: 10px;
}
[data-density="comfortable"] {
  --row: 34px;
  --gap: 16px;
  --pad: 18px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "ss01", "cv11";
}

.mono { font-family: var(--mono); font-feature-settings: "zero", "ss01"; }
.muted { color: var(--text-2); }
.dim { color: var(--text-3); }
.faint { color: var(--text-4); }

button, input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

button {
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 10px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 12px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background 80ms, border-color 80ms;
}
button:hover { background: var(--panel-3); border-color: var(--border-strong); }
button:active { transform: translateY(0.5px); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button.primary { background: var(--accent-bg); border-color: var(--blue-border); color: var(--blue); }
button.primary:hover { background: oklch(70% 0.14 235 / 0.2); }
button.danger { color: var(--red); border-color: var(--red-border); }
button.icon { padding: 5px 7px; }

input[type="text"], input[type="search"], select, textarea {
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 5px 8px;
  border-radius: var(--radius);
  font-size: 12px;
  outline: none;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 2px var(--blue-bg);
}

/* ====== APP SHELL ====== */
.app {
  display: grid;
  grid-template-columns: 220px 1fr;
  grid-template-rows: auto 1fr;
  grid-template-areas:
    "banner banner"
    "sidebar main";
  min-height: 100vh;
}

.env-banner {
  grid-area: banner;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  font-size: 12px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
}
.env-banner.safe   { background: var(--green-bg); border-bottom-color: var(--green-border); color: var(--green); }
.env-banner.caution { background: var(--amber-bg); border-bottom-color: var(--amber-border); color: var(--amber); }
.env-banner.hold   { background: var(--amber-bg); border-bottom-color: var(--amber-border); color: var(--amber); }
.env-banner.block  { background: var(--red-bg); border-bottom-color: var(--red-border); color: var(--red); }
.env-banner .state-code {
  font-family: var(--mono);
  font-weight: 600;
  letter-spacing: 0.04em;
  padding: 2px 8px;
  border-radius: 3px;
  background: rgba(0,0,0,0.25);
  font-size: 11px;
}
[data-theme="light"] .env-banner .state-code { background: rgba(255,255,255,0.6); }
.env-banner .pulse {
  width: 8px; height: 8px; border-radius: 50%;
  background: currentColor;
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { opacity: 0.4; }
  50% { opacity: 1; transform: scale(1.15); }
}
.env-banner .right { margin-left: auto; display: flex; align-items: center; gap: 14px; font-family: var(--mono); font-size: 11px; opacity: 0.85; }

/* ====== SIDEBAR ====== */
.sidebar {
  grid-area: sidebar;
  background: var(--panel);
  border-right: 1px solid var(--border);
  padding: 14px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.sidebar .brand {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px 14px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 10px;
}
.sidebar .brand .mark {
  width: 22px; height: 22px;
  background: var(--text);
  color: var(--bg);
  font-family: var(--mono);
  font-weight: 700;
  font-size: 11px;
  display: grid; place-items: center;
  border-radius: 3px;
}
.sidebar .brand .name {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.sidebar .brand .ver {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-3);
}
.sidebar .section-label {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-3);
  padding: 14px 10px 4px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 10px;
  border-radius: 3px;
  cursor: pointer;
  color: var(--text-2);
  font-size: 12.5px;
  user-select: none;
}
.nav-item:hover { background: var(--panel-2); color: var(--text); }
.nav-item.active { background: var(--panel-3); color: var(--text); }
.nav-item .nav-icon {
  width: 14px; height: 14px;
  flex-shrink: 0;
  opacity: 0.7;
}
.nav-item .nav-kbd {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-3);
  background: var(--panel-2);
  padding: 1px 5px;
  border-radius: 2px;
  border: 1px solid var(--border);
}
.nav-item.active .nav-kbd { background: var(--bg); }
.sidebar .spacer { flex: 1; }
.sidebar .footer {
  padding: 10px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-3);
  border-top: 1px solid var(--border);
  margin-top: 10px;
  display: flex; flex-direction: column; gap: 4px;
}
.sidebar .footer .row { display: flex; justify-content: space-between; }
.sidebar .footer .ok { color: var(--green); }

/* ====== MAIN ====== */
.main {
  grid-area: main;
  padding: 18px 22px 60px;
  overflow-x: hidden;
}
.page-head {
  display: flex; align-items: baseline; gap: 16px;
  padding-bottom: 14px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--border);
}
.page-head h1 {
  font-family: var(--sans);
  font-weight: 500;
  font-size: 18px;
  margin: 0;
  letter-spacing: -0.01em;
}
.page-head .crumb {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-3);
}
.page-head .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.page-head .timestamp {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-3);
}
.page-head .dot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  margin-right: 5px;
  vertical-align: middle;
}

/* ====== CARDS ====== */
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.card .card-head {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-2);
}
.card .card-head .title { color: var(--text); }
.card .card-head .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.card .card-body { padding: var(--pad); }
.card.flat { background: transparent; }

.grid { display: grid; gap: var(--gap); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-5 { grid-template-columns: repeat(5, 1fr); }
.grid-6 { grid-template-columns: repeat(6, 1fr); }

/* ====== BADGES ====== */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  padding: 2px 7px;
  border-radius: 3px;
  border: 1px solid;
  text-transform: uppercase;
  white-space: nowrap;
}
.badge.green { color: var(--green); background: var(--green-bg); border-color: var(--green-border); }
.badge.amber { color: var(--amber); background: var(--amber-bg); border-color: var(--amber-border); }
.badge.red   { color: var(--red);   background: var(--red-bg);   border-color: var(--red-border); }
.badge.blue  { color: var(--blue);  background: var(--blue-bg);  border-color: var(--blue-border); }
.badge.neutral { color: var(--text-2); background: var(--panel-2); border-color: var(--border); }
.badge .dotled { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge .dotled.pulse { animation: pulse 1.4s infinite; }

.tag {
  display: inline-block;
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--text-2);
  background: var(--panel-2);
  border: 1px solid var(--border);
  padding: 1px 6px;
  border-radius: 2px;
}

/* ====== METRICS ====== */
.metric {
  display: flex; flex-direction: column;
  gap: 3px;
  padding: 12px 14px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  min-width: 0;
}
.metric .label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  display: flex; align-items: center; gap: 6px;
}
.metric .value {
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
}
.metric .value.sm { font-size: 18px; }
.metric .sub {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--text-3);
}
.metric.warn .value { color: var(--amber); }
.metric.bad .value { color: var(--red); }
.metric.good .value { color: var(--green); }

/* ====== TABLES ====== */
.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.table th, .table td {
  text-align: left;
  padding: 0 12px;
  height: var(--row);
  border-bottom: 1px solid var(--border);
  font-variant-numeric: tabular-nums;
}
.table th {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-3);
  font-weight: 500;
  background: var(--panel-2);
  position: sticky;
  top: 0;
}
.table td.mono, .table th.mono { font-family: var(--mono); }
.table tbody tr { cursor: default; }
.table tbody tr.clickable { cursor: pointer; }
.table tbody tr.clickable:hover { background: var(--panel-2); }
.table tbody tr.active { background: var(--panel-3); }
.table .num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.table th.num { text-align: right; }
.table .greyed td { color: var(--text-3); }
.table .greyed td .badge { opacity: 0.7; }
.table tr.killed { background: oklch(68% 0.20 25 / 0.04); }
.table td.amber { color: var(--amber); }
.table td.red { color: var(--red); }
.table td.green { color: var(--green); }

.table-wrap {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

/* ====== PROGRESS ====== */
.progress {
  height: 4px;
  background: var(--panel-3);
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}
.progress .bar {
  height: 100%;
  background: var(--blue);
  transition: width 240ms ease-out;
}
.progress.indeterminate .bar {
  background: linear-gradient(90deg, transparent, var(--blue), transparent);
  width: 40%;
  animation: indet 1.6s linear infinite;
}
@keyframes indet {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(350%); }
}

/* ====== STAGE TRACKER ====== */
.stages {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 0;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.stage {
  padding: 12px 14px;
  border-right: 1px solid var(--border);
  background: var(--panel);
  position: relative;
  min-width: 0;
}
.stage:last-child { border-right: none; }
.stage .num {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-3);
}
.stage .name {
  font-family: var(--mono);
  font-size: 11.5px;
  margin-top: 4px;
  letter-spacing: 0.02em;
  color: var(--text-2);
}
.stage .meta {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-3);
  margin-top: 6px;
}
.stage.done { background: var(--panel); }
.stage.done .name { color: var(--text); }
.stage.done .num::before {
  content: "✓ ";
  color: var(--green);
}
.stage.active {
  background: var(--blue-bg);
}
.stage.active .name { color: var(--blue); font-weight: 600; }
.stage.active .num { color: var(--blue); }
.stage.active::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 2px;
  background: var(--blue);
  animation: pulse 1.6s infinite;
}
.stage.todo .name { color: var(--text-3); }
.stage.todo .num { color: var(--text-4); }

/* ====== KV LIST ====== */
.kv {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: 4px 16px;
  font-family: var(--mono);
  font-size: 11.5px;
}
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; color: var(--text); }
.kv dd.amber { color: var(--amber); }
.kv dd.red { color: var(--red); }
.kv dd.green { color: var(--green); }

/* ====== SIGNAL CARD ====== */
.signal-card {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 20px;
  padding: 18px 20px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  align-items: center;
}
.side-pill {
  font-family: var(--mono);
  font-weight: 700;
  font-size: 18px;
  padding: 10px 16px;
  border-radius: 3px;
  letter-spacing: 0.08em;
}
.side-pill.LONG { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
.side-pill.SHORT { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
.side-pill.FLAT { background: var(--panel-2); color: var(--text-2); border: 1px solid var(--border); }

/* ====== GATES ====== */
.gate {
  display: flex; align-items: center;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 3px;
  font-family: var(--mono);
  font-size: 11.5px;
  gap: 10px;
}
.gate .icon {
  width: 14px; height: 14px;
  font-family: var(--mono);
  font-size: 11px;
  display: grid; place-items: center;
  border-radius: 2px;
  flex-shrink: 0;
}
.gate.pass .icon { background: var(--green-bg); color: var(--green); }
.gate.warn .icon { background: var(--amber-bg); color: var(--amber); }
.gate.fail .icon { background: var(--red-bg); color: var(--red); }
.gate.fail { border-color: var(--red-border); }
.gate.warn { border-color: var(--amber-border); }
.gate .name { color: var(--text-2); flex: 1; }
.gate .val { color: var(--text); }
.gate.fail .val { color: var(--red); }
.gate.warn .val { color: var(--amber); }

/* ====== EQUITY CHART ====== */
.chart {
  width: 100%;
  display: block;
  background: var(--panel);
  border-radius: var(--radius);
}
.chart text { font-family: var(--mono); font-size: 10px; fill: var(--text-3); }
.chart .grid line { stroke: var(--border); stroke-dasharray: 2 3; }
.chart .axis line { stroke: var(--border); }
.chart .dd-band { fill: var(--red); opacity: 0.06; }
.chart .ev-bt { stroke: var(--blue); fill: none; stroke-width: 1.4; }
.chart .ev-wf { stroke: var(--amber); fill: none; stroke-width: 1.4; }
.chart .ev-paper { stroke: var(--green); fill: none; stroke-width: 1.6; }
.chart .ev-bt-fill { fill: var(--blue); opacity: 0.06; }
.chart .legend-dot { width: 8px; height: 8px; display: inline-block; border-radius: 2px; vertical-align: middle; margin-right: 5px; }

/* ====== AGENT CARDS ====== */
.agent {
  padding: 14px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex; flex-direction: column; gap: 8px;
}
.agent .name {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-2);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.agent .stance {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px;
}
.agent .conf-bar {
  height: 3px;
  background: var(--panel-3);
  border-radius: 2px;
  overflow: hidden;
}
.agent .conf-bar .fill { height: 100%; background: var(--blue); }
.agent .concern {
  font-size: 12px;
  color: var(--text-2);
  border-left: 2px solid var(--border);
  padding: 4px 0 4px 10px;
  font-style: italic;
}

/* ====== HEATMAP ====== */
.heatmap {
  display: grid;
  gap: 2px;
  font-family: var(--mono);
  font-size: 10px;
}
.heatmap .cell {
  aspect-ratio: 1.6 / 1;
  display: grid; place-items: center;
  border-radius: 2px;
  color: var(--bg);
  font-weight: 600;
}
[data-theme="light"] .heatmap .cell { color: #fff; }

/* ====== UTIL ====== */
.row-flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row-flex.between { justify-content: space-between; }
.split { display: flex; gap: 12px; }
.split > * { flex: 1; }
hr.sep { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

.reason-code {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--red);
  background: var(--red-bg);
  border: 1px solid var(--red-border);
  padding: 1px 6px;
  border-radius: 2px;
  letter-spacing: 0.04em;
}
.reason-code.warn { color: var(--amber); background: var(--amber-bg); border-color: var(--amber-border); }
.reason-code.info { color: var(--blue); background: var(--blue-bg); border-color: var(--blue-border); }

.staleness {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--amber);
  display: inline-flex; align-items: center; gap: 5px;
}

.scroll-x { overflow-x: auto; }

/* details/summary */
details.collapsible {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--panel);
}
details.collapsible summary {
  padding: 10px 14px;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-2);
  list-style: none;
  display: flex; align-items: center; gap: 8px;
}
details.collapsible summary::before {
  content: "▸";
  font-size: 10px;
  transition: transform 120ms;
}
details.collapsible[open] summary::before { transform: rotate(90deg); }
details.collapsible .content {
  padding: 0 14px 14px;
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.6;
  color: var(--text-2);
  white-space: pre-wrap;
}

/* filter bar */
.filter-bar {
  display: flex; gap: 8px; align-items: center;
  padding: 10px 14px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.filter-bar .filter-group {
  display: flex; align-items: center; gap: 6px;
}
.filter-bar .filter-group label {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-3);
}
.filter-bar .spacer { flex: 1; }
.filter-bar .count {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-2);
}

/* segmented */
.segmented {
  display: inline-flex;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.segmented button {
  border: none;
  border-radius: 0;
  background: var(--panel);
  padding: 4px 10px;
  font-family: var(--mono);
  font-size: 11px;
  border-right: 1px solid var(--border);
}
.segmented button:last-child { border-right: none; }
.segmented button.active { background: var(--panel-3); color: var(--text); }

/* sparkline */
.spark { display: inline-block; vertical-align: middle; }

/* dialog/modal-ish */
.callout {
  display: flex; gap: 12px;
  padding: 10px 14px;
  border-radius: var(--radius);
  background: var(--panel-2);
  border: 1px solid var(--border);
  font-size: 12px;
}
.callout .ico {
  font-family: var(--mono);
  font-weight: 600;
  flex-shrink: 0;
}
.callout.warn { background: var(--amber-bg); border-color: var(--amber-border); color: var(--amber); }
.callout.bad { background: var(--red-bg); border-color: var(--red-border); color: var(--red); }
.callout.info { background: var(--blue-bg); border-color: var(--blue-border); color: var(--blue); }

/* sub-table for committee */
.findings-list { display: flex; flex-direction: column; gap: 6px; }
.finding {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  padding: 10px 12px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 3px;
  font-family: var(--mono);
  font-size: 11.5px;
  align-items: center;
}
.finding.high { background: var(--red-bg); border-color: var(--red-border); }
.finding .sev {
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 0.08em;
  padding: 2px 6px;
  border-radius: 2px;
}
.finding.high .sev { color: var(--red); background: rgba(0,0,0,0.2); }
.finding.medium .sev { color: var(--amber); }
.finding.low .sev { color: var(--text-3); }
.finding .loc { color: var(--text-2); }
.finding .desc { color: var(--text); }
.finding .fix { color: var(--text-3); font-size: 10.5px; }

</style>

<script type="text/babel" data-presets="env,react">
// Shared UI primitives for TAR

function Badge({ kind, children, pulse }) {
  // kind: KEEP|REVIEW|KILL|QUEUED|RUNNING|COMPLETED|FAILED|SAFE_TO_TEST|CAUTION|HOLD_TRADING|BLOCK_TRADING|neutral
  const map = {
    KEEP: "green", REVIEW: "amber", KILL: "red",
    QUEUED: "neutral", RUNNING: "blue", COMPLETED: "green", FAILED: "red",
    SAFE_TO_TEST: "green", CAUTION: "amber", HOLD_TRADING: "amber", BLOCK_TRADING: "red",
    LONG: "green", SHORT: "red", FLAT: "neutral",
    HIGH: "red", MEDIUM: "amber", LOW: "neutral",
    PASS: "green", WARN: "amber", FAIL: "red",
  };
  const cls = map[kind] || "neutral";
  return (
    <span className={`badge ${cls}`}>
      {pulse && <span className="dotled pulse" />}
      {children || kind}
    </span>
  );
}

function ReasonCode({ code, kind }) {
  const cls = kind === "warn" ? "warn" : kind === "info" ? "info" : "";
  return <code className={`reason-code ${cls}`}>{code}</code>;
}

function Card({ title, right, children, flat, style }) {
  return (
    <div className={`card ${flat ? "flat" : ""}`} style={style}>
      {(title || right) && (
        <div className="card-head">
          <span className="title">{title}</span>
          {right && <span className="right">{right}</span>}
        </div>
      )}
      <div className="card-body">{children}</div>
    </div>
  );
}

function Metric({ label, value, sub, tone, hint }) {
  return (
    <div className={`metric ${tone || ""}`}>
      <div className="label">{label}{hint && <span className="dim" title={hint}>ⓘ</span>}</div>
      <div className={`value ${(typeof value === "string" && value.length > 8) ? "sm" : ""}`}>{value}</div>
      {sub && <div className="sub">{sub}</div>}
    </div>
  );
}

function Progress({ pct, indeterminate }) {
  if (indeterminate) return <div className="progress indeterminate"><div className="bar" /></div>;
  return <div className="progress"><div className="bar" style={{ width: `${Math.max(0, Math.min(100, pct))}%` }} /></div>;
}

function timeAgo(iso) {
  if (!iso) return "—";
  const ms = Date.now() - new Date(iso).getTime();
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return `${s}s ago`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  return `${Math.floor(h / 24)}d ago`;
}

function fmtDuration(s) {
  if (s == null) return "—";
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  const rem = s % 60;
  if (m < 60) return `${m}m ${rem}s`;
  const h = Math.floor(m / 60);
  return `${h}h ${m % 60}m`;
}

function fmtNum(n, digits = 2) {
  if (n == null) return "—";
  return Number(n).toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits });
}

function fmtPct(n, digits = 1) {
  if (n == null) return "—";
  return `${(n * 100).toFixed(digits)}%`;
}

function fmtPctDirect(n, digits = 1) {
  if (n == null) return "—";
  return `${n.toFixed(digits)}%`;
}

function ddTone(dd) {
  if (dd == null) return "";
  if (dd >= 40) return "red";
  if (dd >= 20) return "amber";
  return "";
}

function ddBadgeTone(dd) {
  if (dd == null) return "";
  if (dd >= 40) return "bad";
  if (dd >= 20) return "warn";
  return "";
}

function Gate({ state, name, value }) {
  // state: pass | warn | fail
  const icon = state === "pass" ? "✓" : state === "warn" ? "!" : "✕";
  return (
    <div className={`gate ${state}`}>
      <span className="icon">{icon}</span>
      <span className="name">{name}</span>
      <span className="val">{value}</span>
    </div>
  );
}

function Callout({ kind, ico, children }) {
  return (
    <div className={`callout ${kind || ""}`}>
      <span className="ico">{ico || "ⓘ"}</span>
      <div>{children}</div>
    </div>
  );
}

function Sparkline({ data, color, width = 80, height = 22 }) {
  if (!data || data.length === 0) return null;
  const min = Math.min(...data);
  const max = Math.max(...data);
  const range = max - min || 1;
  const stepX = width / (data.length - 1 || 1);
  const points = data.map((v, i) => `${i * stepX},${height - ((v - min) / range) * height}`).join(" ");
  return (
    <svg className="spark" width={width} height={height}>
      <polyline points={points} fill="none" stroke={color || "currentColor"} strokeWidth="1.2" />
    </svg>
  );
}

Object.assign(window, { Badge, ReasonCode, Card, Metric, Progress, timeAgo, fmtDuration, fmtNum, fmtPct, fmtPctDirect, ddTone, ddBadgeTone, Gate, Callout, Sparkline });

</script>

    return true;

function LegendDot({ color }) {

// ---- synthetic generators ----

function seedFrom(s) {
  // simple string hash → seed
  const str = `${s.strategy}|${s.symbol}|${s.tf}`;
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = (h * 16777619) >>> 0; }
  return h;
}

function mulberry32(a) {
  return function() {
    let t = (a += 0x6D2B79F5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function generateEquityCurves(s) {
  const rand = mulberry32(seedFrom(s));
  const N = 180;
  const labels = [];
  const start = new Date(2024, 0, 1);
  for (let i = 0; i < N; i++) {
    const d = new Date(start);
    d.setDate(d.getDate() + Math.floor(i * 5.5));
    labels.push(d.toISOString().slice(0, 10));
  }

  // backtest: trend up if KEEP, sideways/down if KILL
  const direction = s.verdict === "KEEP" ? 1 : s.verdict === "REVIEW" ? 0.3 : -0.5;
  const vol = s.max_dd ? s.max_dd / 100 : 0.15;
  let bt = 10000;
  const backtest = [bt];
  for (let i = 1; i < N; i++) {
    const ret = direction * 0.0018 + (rand() - 0.5) * vol * 0.06;
    bt *= 1 + ret;
    backtest.push(bt);
  }

  // walk-forward OOS: starts at split boundary, more noisy
  const wfStart = Math.floor(N * 0.65);
  const wf = labels.map((_, i) => {
    if (i < wfStart) return null;
    const t = i - wfStart;
    let v = backtest[wfStart];
    const r2 = mulberry32(seedFrom(s) ^ 0xA5A5);
    for (let k = 0; k <= t; k++) {
      const ret = direction * 0.0011 + (r2() - 0.5) * vol * 0.08;
      v *= 1 + ret;
    }
    return v;
  });

  // paper equity: very recent only
  const paperStart = Math.floor(N * 0.88);
  const paper = labels.map((_, i) => {
    if (i < paperStart) return null;
    const t = i - paperStart;
    let v = (wf[paperStart] ?? backtest[paperStart]);
    const r3 = mulberry32(seedFrom(s) ^ 0x5A5A);
    for (let k = 0; k <= t; k++) {
      const ret = direction * 0.0009 + (r3() - 0.5) * vol * 0.05;
      v *= 1 + ret;
    }
    return v;
  });

  return { labels, backtest, wf, paper };
}

function getParams(s) {
  // synthetic param set keyed loosely by strategy family
  if (s.strategy.startsWith("ema")) {
    return [
      { name: "ema_fast", value: 12, baseline: 12 },
      { name: "ema_slow", value: 34, baseline: 30, diff: 4 },
      { name: "atr_period", value: 14, baseline: 14 },
      { name: "atr_mult_stop", value: 2.2, baseline: 2.2 },
      { name: "atr_mult_target", value: 3.0, baseline: 3.0 },
      { name: "session_filter", value: "LDN+NY", baseline: "LDN+NY" },
      { name: "min_trades_gate", value: 30, baseline: 30 },
    ];
  }
  if (s.strategy.startsWith("atr")) {
    return [
      { name: "atr_period", value: 20, baseline: 14, diff: 6 },
      { name: "atr_mult_stop", value: 2.8, baseline: 2.2 },
      { name: "breakout_lookback", value: 50, baseline: 50 },
      { name: "session_filter", value: "24h", baseline: "LDN+NY" },
      { name: "min_trades_gate", value: 30, baseline: 30 },
    ];
  }
  return [
    { name: "lookback", value: 20, baseline: 20 },
    { name: "threshold", value: 1.5, baseline: 1.5 },
    { name: "session_filter", value: "LDN+NY", baseline: "LDN+NY" },
    { name: "min_trades_gate", value: 30, baseline: 30 },
  ];
}

window.PageDetail = PageDetail;

</script>
<script type="text/babel" data-presets="env,react">
// Main app shell: env banner + sidebar + router

const NAV = [
  { id: "dashboard", label: "Pipeline", icon: "▸", kbd: "1", enabled: true },
  { id: "explorer", label: "Strategies", icon: "▤", kbd: "2", enabled: true },
  { id: "jobs", label: "Jobs", icon: "⌷", kbd: "3", enabled: false },
  { id: "signals", label: "Signals", icon: "↯", kbd: "4", enabled: false },
  { id: "optim", label: "Optimisation", icon: "◫", kbd: "5", enabled: false },
  { id: "research", label: "Research", icon: "✎", kbd: "6", enabled: false },
  { id: "audit", label: "Data & Audit", icon: "❡", kbd: "7", enabled: false },
];

const ENV_STATES = {
  SAFE_TO_TEST: { cls: "safe", text: "No high-impact events in window. System cleared for signal generation." },
  CAUTION: { cls: "caution", text: "Event scheduled within 4h window. Monitor closely; reduce position sizing." },
  HOLD_TRADING: { cls: "hold", text: "Active high-impact window in progress. New signals paused until window closes." },
  BLOCK_TRADING: { cls: "block", text: "Hard block active. Signal generation disabled. Cannot be overridden from UI." },
};

function App() {
  const t = useTweaks(/*EDITMODE-BEGIN*/{
    "theme": "dark",
    "density": "normal",
    "env_state": "SAFE_TO_TEST",
    "accent": "blue"
  }/*EDITMODE-END*/);

  // Apply theme + density to root
  React.useEffect(() => {
    document.documentElement.setAttribute("data-theme", t.theme);
    document.documentElement.setAttribute("data-density", t.density);
    document.documentElement.style.setProperty(
      "--accent",
      t.accent === "amber" ? "var(--amber)" : t.accent === "green" ? "var(--green)" : t.accent === "violet" ? "var(--violet)" : "var(--blue)"
    );
    document.documentElement.style.setProperty(
      "--accent-bg",
      t.accent === "amber" ? "var(--amber-bg)" : t.accent === "green" ? "var(--green-bg)" : t.accent === "violet" ? "oklch(70% 0.15 295 / 0.12)" : "var(--blue-bg)"
    );
  }, [t.theme, t.density, t.accent]);

  const [page, setPage] = React.useState("dashboard");
  const [selectedStrategy, setSelectedStrategy] = React.useState(null);

  function navigate(target, payload) {
    if (target === "detail") setSelectedStrategy(payload || STRATEGIES[0]);
    setPage(target);
    window.scrollTo({ top: 0, behavior: "instant" });
  }

  // Keyboard nav
  React.useEffect(() => {
    function onKey(e) {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
      const item = NAV.find(n => n.kbd === e.key);
      if (item && item.enabled) navigate(item.id);
    }
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const envState = t.env_state;
  const env = ENV_STATES[envState];

  const pageTitle = {
    dashboard: { title: "Pipeline Dashboard", crumb: "home / pipeline" },
    explorer: { title: "Strategy Explorer", crumb: "strategies / explorer" },
    detail: { title: selectedStrategy ? `${selectedStrategy.strategy}` : "Strategy Detail", crumb: `strategies / ${selectedStrategy ? `${selectedStrategy.strategy}_${selectedStrategy.symbol}_${selectedStrategy.tf}` : "—"}` },
  }[page] || { title: "Not implemented", crumb: page };

  return (
    <div className="app">
      {/* Env banner — top of every page */}
      <div className={`env-banner ${env.cls}`}>
        <span className="pulse" />
        <span className="state-code">{envState}</span>
        <span style={{ opacity: 0.9 }}>{env.text}</span>
        <span className="right">
          <span>paper_mode=<strong>true</strong></span>
          <span>live_trading_allowed=<strong>false</strong></span>
          <span>{new Date().toISOString().replace(/\.\d+Z$/, "Z")}</span>
        </span>
      </div>

      {/* Sidebar */}
      <nav className="sidebar">
        <div className="brand">
          <div className="mark">T</div>
          <div className="name">TAR</div>
          <div className="ver">v2.4</div>
        </div>

        <div className="section-label">Research</div>
        {NAV.map(n => (
          <div
            key={n.id}
            className={`nav-item ${page === n.id || (page === "detail" && n.id === "explorer") ? "active" : ""}`}
            onClick={() => n.enabled && navigate(n.id)}
            style={{ opacity: n.enabled ? 1 : 0.4, cursor: n.enabled ? "pointer" : "not-allowed" }}
            title={n.enabled ? "" : "Not implemented in this prototype"}
          >
            <span className="nav-icon mono">{n.icon}</span>
            <span>{n.label}</span>
            <span className="nav-kbd">{n.kbd}</span>
          </div>
        ))}

        <div className="spacer" />

        <div className="footer">
          <div className="row"><span>daemon</span><span className="ok">● running</span></div>
          <div className="row"><span>queue</span><span>{JOBS.filter(j => j.status === "queued").length} queued</span></div>
          <div className="row"><span>poll</span><span>5s</span></div>
          <div className="row"><span>build</span><span>a92f1c8</span></div>
        </div>
      </nav>

      {/* Main */}
      <main className="main">
        <div className="page-head">
          <div>
            <div className="crumb">{pageTitle.crumb}</div>
            <h1>{pageTitle.title}</h1>
          </div>
          <div className="actions">
            <span className="timestamp"><span className="dot" />last sync · 4s ago</span>
            <button className="icon" title="Refresh">↻</button>
          </div>
        </div>

        {page === "dashboard" && <PageDashboard tweaks={t} onNavigate={navigate} />}
        {page === "explorer" && <PageExplorer onNavigate={navigate} />}
        {page === "detail" && <PageDetail strategy={selectedStrategy} onNavigate={navigate} />}
        {!["dashboard", "explorer", "detail"].includes(page) && (
          <Card title="Not implemented">
            <div style={{ padding: 24, textAlign: "center" }} className="muted">
              <p>This screen is not part of the current prototype scope.</p>
              <p className="dim mono" style={{ fontSize: 11 }}>scope: Pipeline Dashboard · Strategy Explorer · Strategy Detail</p>
            </div>
          </Card>
        )}
      </main>

      {/* Tweaks */}
      <TweaksPanel title="Tweaks">
        <TweakSection title="Appearance">
          <TweakRadio
            label="Theme"
            value={t.theme}
            onChange={(v) => t.setTweak("theme", v)}
            options={[{ value: "dark", label: "Dark" }, { value: "light", label: "Light" }]}
          />
          <TweakRadio
            label="Density"
            value={t.density}
            onChange={(v) => t.setTweak("density", v)}
            options={[
              { value: "compact", label: "Compact" },
              { value: "normal", label: "Normal" },
              { value: "comfortable", label: "Roomy" },
            ]}
          />
          <TweakColor
            label="Accent"
            value={t.accent}
            onChange={(v) => t.setTweak("accent", v)}
            options={[
              { value: "blue", color: "oklch(70% 0.14 235)" },
              { value: "green", color: "oklch(70% 0.15 150)" },
              { value: "amber", color: "oklch(78% 0.15 75)" },
              { value: "violet", color: "oklch(70% 0.15 295)" },
            ]}
          />
        </TweakSection>
        <TweakSection title="Environment Risk (simulate)">
          <TweakSelect
            label="State"
            value={t.env_state}
            onChange={(v) => t.setTweak("env_state", v)}
            options={[
              { value: "SAFE_TO_TEST", label: "SAFE_TO_TEST" },
              { value: "CAUTION", label: "CAUTION" },
              { value: "HOLD_TRADING", label: "HOLD_TRADING" },
              { value: "BLOCK_TRADING", label: "BLOCK_TRADING (red banner)" },
            ]}
          />
          <div className="mono dim" style={{ fontSize: 10, marginTop: 6, lineHeight: 1.5 }}>
            Spec rule: BLOCK_TRADING cannot be overridden from UI in production.
            This tweak exists only to preview banner states.
          </div>
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

// Custom TweakColor variant accepting {value, color} objects
function TweakColor({ label, value, onChange, options }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
      <div className="mono" style={{ fontSize: 10, color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.08em" }}>{label}</div>
      <div style={{ display: "flex", gap: 6 }}>
        {options.map(o => (
          <button
            key={o.value}
            onClick={() => onChange(o.value)}
            style={{
              width: 28, height: 28,
              borderRadius: 4,
              background: o.color,
              border: value === o.value ? "2px solid var(--text)" : "1px solid var(--border)",
              padding: 0,
              cursor: "pointer",
            }}
            title={o.value}
          />
        ))}
      </div>
    </div>
  );
}

// Custom radio that uses our segmented style
function TweakRadio({ label, value, onChange, options }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
      <div className="mono" style={{ fontSize: 10, color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.08em" }}>{label}</div>
      <div className="segmented" style={{ width: "fit-content" }}>
        {options.map(o => (
          <button key={o.value} className={value === o.value ? "active" : ""} onClick={() => onChange(o.value)}>
            {o.label}
          </button>
        ))}
      </div>
    </div>
  );
}

function TweakSelect({ label, value, onChange, options }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
      <div className="mono" style={{ fontSize: 10, color: "var(--text-3)", textTransform: "uppercase", letterSpacing: "0.08em" }}>{label}</div>
      <select value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
      </select>
    </div>
  );
}

function TweakSection({ title, children }) {
  return (
    <div style={{ marginBottom: 16 }}>
      <div className="mono" style={{
        fontSize: 10,
        textTransform: "uppercase",
        letterSpacing: "0.1em",
        color: "var(--text-2)",
        marginBottom: 10,
        paddingBottom: 6,
        borderBottom: "1px solid var(--border)",
      }}>{title}</div>
      {children}
    </div>
  );
}

function useTweaks(defaults) {
  const [state, setState] = React.useState(defaults);

  React.useEffect(() => {
    function onMsg(e) {
      if (e.data?.type === "__edit_mode_set_keys") {
        setState(s => ({ ...s, ...e.data.edits }));
      }
    }
    window.addEventListener("message", onMsg);
    return () => window.removeEventListener("message", onMsg);
  }, []);

  function setTweak(key, value) {
    setState(s => ({ ...s, [key]: value }));
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { [key]: value } }, "*");
  }

  return { ...state, setTweak };
}

// Minimal TweaksPanel that wires the host protocol
function TweaksPanel({ title = "Tweaks", children }) {
  const [open, setOpen] = React.useState(false);

  React.useEffect(() => {
    function onMsg(e) {
      if (e.data?.type === "__activate_edit_mode") setOpen(true);
      if (e.data?.type === "__deactivate_edit_mode") setOpen(false);
    }
    window.addEventListener("message", onMsg);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", onMsg);
  }, []);

  function close() {
    setOpen(false);
    window.parent.postMessage({ type: "__edit_mode_dismissed" }, "*");
  }

  if (!open) return null;
  return (
    <div style={{
      position: "fixed",
      right: 20, bottom: 20,
      width: 320,
      maxHeight: "80vh",
      background: "var(--panel)",
      border: "1px solid var(--border-strong)",
      borderRadius: 6,
      boxShadow: "0 8px 32px rgba(0,0,0,0.5)",
      padding: 16,
      overflow: "auto",
      zIndex: 9999,
      fontFamily: "var(--sans)",
    }}>
      <div style={{
        display: "flex",
        alignItems: "center",
        marginBottom: 14,
        paddingBottom: 10,
        borderBottom: "1px solid var(--border)",
      }}>
        <span className="mono" style={{ fontSize: 12, fontWeight: 600, letterSpacing: "0.04em" }}>{title}</span>
        <button className="icon" onClick={close} style={{ marginLeft: "auto", padding: "2px 8px" }}>✕</button>
      </div>
      {children}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
