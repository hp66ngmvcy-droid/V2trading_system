[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tar-system"
version = "0.1.0"
description = "Lean local-first trading research system"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["F821"]
